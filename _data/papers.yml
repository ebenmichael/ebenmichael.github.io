- id: benmichael-2026-weighting
  title: "A Weighting Framework for Clusters as Confounders in Observational Studies"
  authors: ["Eli Ben-Michael", "Avi Feller", "Luke Keele"]
  type: preprint
  venue: ""
  year: 2026
  topics: [balancing-weights]
  links:
    arxiv: "2602.05041"
  abstract: >-
    When units in observational studies are clustered in groups, such as students in schools or patients in hospitals, researchers often address confounding by adjusting for cluster-level covariates or cluster membership. In this paper, we develop a unified weighting framework that clarifies how different estimation methods control two distinct sources of imbalance: global balance (differences between treated and control units across clusters) and local balance (differences within clusters). We show that inverse propensity score weighting (IPW) with a random effects propensity score model -- the current standard in the literature -- targets only global balance and constant level shifts across clusters, but imposes no constraints on local balance. We then present two approaches that target both forms of balance. First, hierarchical balancing weights directly control global and local balance through a constrained optimization problem. Second, building on the recently proposed Generalized Mundlak approach, we develop a novel Mundlak balancing weights estimator that adjusts for cluster-level sufficient statistics rather than cluster indicators; this approach can accommodate small clusters where all units are treated or untreated. Critically, these approaches rest on different assumptions: hierarchical balancing weights require only that treatment is ignorable given covariates and cluster membership, while Mundlak methods additionally require an exponential family structure. We then compare these methods in a simulation study and in two applications in education and health services research that exhibit very different cluster structures.

- id: benmichael-2025-partial
  title: "Partial Identification via Conditional Linear Programs: Estimation and Policy learning"
  authors: ["Eli Ben-Michael"]
  type: preprint
  venue: ""
  year: 2025
  topics: [sensitivity-partial-id, policy-learning]
  links:
    arxiv: "2506.12215"
  abstract: >-
    Many important quantities of interest are only partially identified from observable data: the data can limit them to a set of plausible values, but not uniquely determine them. This paper develops a unified framework for covariate-assisted estimation, inference, and decision making in partial identification problems where the parameter of interest satisfies a series of linear constraints, conditional on covariates. In such settings, bounds on the parameter can be written as expectations of solutions to conditional linear programs that optimize a linear function subject to linear constraints, where both the objective function and the constraints may depend on covariates and need to be estimated from data. Examples include estimands involving the joint distributions of potential outcomes, policy learning with inequality-aware value functions, and instrumental variable settings. We propose two de-biased estimators for bounds defined by conditional linear programs. The first directly solves the conditional linear programs with plugin estimates and uses output from standard LP solvers to de-bias the plugin estimate, avoiding the need for computationally demanding vertex enumeration of all possible solutions for symbolic bounds. The second uses entropic regularization to create smooth approximations to the conditional linear programs, trading a small amount of approximation error for improved estimation and computational efficiency. We establish conditions for asymptotic normality of both estimators, show that both estimators are robust to first-order errors in estimating the conditional constraints and objectives, and construct Wald-type confidence intervals for the partially identified parameters. These results also extend to policy learning problems where the value of a decision policy is only partially identified. We apply our methods to a study on the effects of Medicaid enrollment.

- id: levis-2024-intervention
  title: "Intervention Effects Based on Potential Benefit"
  authors: ["Alexander W. Levis", "Eli Ben-Michael", "Edward H. Kennedy"]
  type: preprint
  venue: ""
  year: 2024
  topics: [policy-learning]
  links:
    arxiv: "2405.08727"
  abstract: >-
    Optimal treatment rules are mappings from individual patient characteristics to tailored treatment assignments that maximize mean outcomes. In this work, we introduce a conditional potential benefit (CPB) metric that measures the expected improvement under an optimally chosen treatment compared to the status quo, within covariate strata. The potential benefit combines (i) the magnitude of the treatment effect, and (ii) the propensity for subjects to naturally select a suboptimal treatment. As a consequence, heterogeneity in the CPB can provide key insights into the mechanism by which a treatment acts and/or highlight potential barriers to treatment access or adverse effects. Moreover, we demonstrate that CPB is the natural prioritization score for individualized treatment policies when intervention capacity is constrained. That is, in the resource-limited setting where treatment options are freely accessible, but the ability to intervene on a portion of the target population is constrained (e.g., if the population is large, and follow-up and encouragement of treatment uptake is labor-intensive), targeting subjects with highest CPB maximizes the mean outcome. Focusing on this resource-limited setting, we derive formulas for optimal constrained treatment rules, and for any given budget, quantify the loss compared to the optimal unconstrained rule. We describe sufficient identification assumptions, and propose nonparametric, robust, and efficient estimators of the proposed quantities emerging from our framework. Finally, we illustrate our methodology using data from a prospective cohort study in which we assess the impact of intensive care unit transfer on mortality.

- id: zhang-2022-safe
  title: "Safe Policy Learning under Regression Discontinuity Designs with Multiple Cutoffs"
  authors: ["Yi Zhang", "Eli Ben-Michael", "Kosuke Imai"]
  type: preprint
  venue: ""
  year: 2022
  topics: [policy-learning, sensitivity-partial-id]
  award: "ASA Social Statistics Section Student Paper Award (Yi Zhang)"
  links:
    arxiv: "2208.13323"
  abstract: >-
    The regression discontinuity (RD) design is widely used for program evaluation with observational data. The primary focus of the existing literature has been the estimation of the local average treatment effect at the existing treatment cutoff. In contrast, we consider policy learning under the RD design. Because the treatment assignment mechanism is deterministic, learning better treatment cutoffs requires extrapolation. We develop a robust optimization approach to finding optimal treatment cutoffs that improve upon the existing ones. We first decompose the expected utility into point-identifiable and unidentifiable components. We then propose an efficient doubly-robust estimator for the identifiable parts. To account for the unidentifiable components, we leverage the existence of multiple cutoffs that are common under the RD design. Specifically, we assume that the heterogeneity in the conditional expectations of potential outcomes across different groups vary smoothly along the running variable. Under this assumption, we minimize the worst case utility loss relative to the status quo policy. The resulting new treatment cutoffs have a safety guarantee that they will not yield a worse overall outcome than the existing cutoffs. Finally, we establish the asymptotic regret bounds for the learned policy using semi-parametric efficiency theory. We apply the proposed methodology to empirical and simulated data sets.

- id: benmichael-2021-balancing
  title: "The Balancing Act in Causal Inference"
  authors: ["Eli Ben-Michael", "Avi Feller", "David A. Hirshberg", "José R. Zubizarreta"]
  type: preprint
  venue: ""
  year: 2021
  topics: [balancing-weights]
  links:
    arxiv: "2110.14831"
  abstract: >-
    The idea of covariate balance is at the core of causal inference. Inverse propensity weights play a central role because they are the unique set of weights that balance the covariate distributions of different treatment groups. We discuss two broad approaches to estimating these weights: the more traditional one, which fits a propensity score model and then uses the reciprocal of the estimated propensity score to construct weights, and the balancing approach, which estimates the inverse propensity weights essentially by the method of moments, finding weights that achieve balance in the sample. We review ideas from the causal inference, sample surveys, and semiparametric estimation literatures, with particular attention to the role of balance as a sufficient condition for robust inference. We focus on the inverse propensity weighting and augmented inverse propensity weighting estimators for the average treatment effect given strong ignorability and consider generalizations for a broader class of problems including policy evaluation and the estimation of individualized treatment effects.

- id: shen-2026-forest
  title: "Forest Kernel Balancing Weights: Outcome-Guided Features for Causal Inference"
  authors: ["Andy A. Shen", "Eli Ben-Michael", "Avi Feller", "Luke Keele", "Jared Murray"]
  type: article
  venue: "Statistics in Medicine"
  year: 2026
  topics: [balancing-weights]
  links:
    journal: "https://onlinelibrary.wiley.com/doi/full/10.1002/sim.70720"
    arxiv: "2512.11751"
  doi: "10.1002/sim.70720"
  abstract: >-
    While balancing covariates between groups is central for observational causal inference, selecting which features to balance remains a challenging problem. Kernel balancing is a promising approach that first estimates a kernel that captures similarity across units and then balances a (possibly low-dimensional) summary of that kernel, indirectly learning important features to balance. In this paper, we propose forest kernel balancing, which leverages the underappreciated fact that tree-based machine learning models, namely random forests and Bayesian additive regression trees (BART), implicitly estimate a kernel based on the co-occurrence of observations in the same terminal leaf node. Thus, even though the resulting kernel is solely a function of baseline features, the selected nonlinearities and other interactions are important for predicting the outcome -- and therefore are important for addressing confounding. Through simulations and applied illustrations, we show that forest kernel balancing leads to meaningful computational and statistical improvement relative to standard kernel methods, which do not incorporate outcome information when learning features.

- id: sundberg-2026-learning
  title: "Learning Who to Treat When Treatment is Missing"
  authors: ["Johnna Sundberg", "Rayid Ghani", "Eli Ben-Michael", "Edward Kennedy"]
  type: article
  venue: "Conference on Uncertainty in Artificial Intelligence"
  year: 2026
  topics: [policy-learning]
  links:
    arxiv: "2607.14346"
  abstract: >-
    Policy learning methods are increasingly used to inform treatment allocation under budget constraints. Most proposed methods assume complete treatment data, yet applications frequently suffer from missingness that can bias estimates and lead to suboptimal policies. We address this gap by extending efficient estimators for average treatment effect (ATE) estimation to policy value and conditional average treatment effect (CATE) estimation under missing at random (MAR) and missing completely conditionally at random (MCCAR) treatment data. Through asymptotic efficiency analysis, we prove that the MAR estimator, which leverages partially-observed units, is both valid and more efficient than the MCCAR estimator when MCCAR assumptions hold. This result provides formal justification for preferring MAR-based estimation in policy learning under both missing data settings. Our comprehensive experiments using synthetic and semi-synthetic datasets confirm that correctly specifying the missingness mechanism is crucial: misspecified estimators remain biased regardless of sample size, while our estimators achieve near-oracle performance when assumptions are satisfied. Our work provides practitioners with theoretically grounded, empirically validated tools for robust policy learning in the presence of missing treatment data.

- id: arbour-2026-ai
  title: "AI-Assisted Variance Reduction in Randomized Experiments"
  authors: ["David Arbour", "Eli Ben-Michael", "Avi Feller", "Apoorva Lal", "Lo-Hua Yuan"]
  type: article
  venue: "SIGKDD International Conference on Knowledge Discovery and Data Mining"
  year: 2026
  topics: [experiments, ai-llms]
  links:
    arxiv: "2606.08853"
  abstract: >-
    Generative AI and large language models can produce realistic predictions of human behavior from rich, unstructured inputs with little to no task-specific training data. Recent work uses these “digital twin” predictions to supplement human responses in surveys and experiments. We study the special case of using AI-generated predictions to reduce variance in randomized experiments. We argue that doing so requires no new estimators and that researchers can simply include AI predictions as covariates in standard regression adjustment, analogous to adjusting for a prognostic score. A benefit of this approach is a “do no harm” property whereby the adjusted estimator reverts to the unadjusted difference in means when predictions are uninformative. Other methods, such as variants of prediction-powered inference, do not have this guarantee. We provide implementation guidance, including how to obtain continuous scores from discrete LLM outputs and how to use LLMs to featurize unstructured inputs as auxiliary covariates. We demonstrate these ideas in simulations and three empirical applications: a survey mega-study, an email marketing A/B test, and a large-scale technology platform experiment. Overall, efficiency gains are real if modest, with greater benefits in studies that contain substantial text and other unstructured data. We also confirm the do no harm property empirically. Given these gains and limited costs, we recommend adjusting for AI-generated predictions as a regular empirical practice.

- id: jiang-2026-longitudinal
  title: "Longitudinal Causal Inference with Selective Eligibility"
  authors: ["Zhichao Jiang", "Eli Ben-Michael", "D. James Greiner", "Ryan Halen", "Kosuke Imai"]
  type: article
  venue: "Annals of Applied Statistics"
  year: 2026
  forthcoming: true
  topics: [experiments, criminal-justice]
  links:
    arxiv: "2410.17864"
  abstract: >-
    Dropout poses a significant challenge to causal inference in longitudinal studies with time-varying treatments. However, existing research does not simultaneously address dropout and time-varying treatments. We examine selective eligibility, an important yet overlooked source of non-ignorable dropout in such settings. This problem arises when a unit's prior treatment history influences its eligibility for subsequent treatments, a common scenario in medical and other settings. We propose a general methodological framework for longitudinal causal inference with selective eligibility. By focusing on a subgroup of units who would become eligible for treatment given a specific past treatment sequence, we define the time-specific eligible treatment effect and expected number of outcome events under a treatment sequence of interest. Under a generalized version of sequential ignorability, we derive two nonparametric identification formulae, each leveraging different parts of the observed data distribution. We then derive the efficient influence function of each causal estimand, yielding the corresponding doubly robust estimator. Finally, we apply the proposed methodology to an impact evaluation of a pre-trial risk assessment instrument in the criminal justice system, in which selective eligibility arises due to recidivism.

- id: lin-2026-omitted
  title: "Omitted Variable Bias in Language Models Under Distribution Shift"
  authors: ["Victoria Lin", "Louis-Philippe Morency", "Eli Ben-Michael"]
  type: article
  venue: "International Conference on Machine Learning"
  year: 2026
  topics: [ai-llms, sensitivity-partial-id]
  links:
    arxiv: "2602.16784"
  abstract: >-
    Despite their impressive performance on a wide variety of tasks, modern language models remain susceptible to distribution shifts, exhibiting brittle behavior when evaluated on data that differs in distribution from their training data. In this paper, we describe how distribution shifts in language models can be separated into observable and unobservable components, and we discuss how established approaches for dealing with distribution shift address only the former. Importantly, we identify that the resulting omitted variable bias from unobserved variables can compromise both evaluation and optimization in language models. To address this challenge, we introduce a framework that maps the strength of the omitted variables to bounds on the worst-case generalization performance of language models under distribution shift. In empirical experiments, we show that using these bounds directly in language model evaluation and optimization provides more principled measures of out-of-distribution performance, improves true out-of-distribution performance relative to standard distribution shift adjustment methods, and further enables inference about the strength of the omitted variables when target distribution labels are available.

- id: keele-2026-balancing
  title: "Balancing Weights for Estimating Treatment Effects in Educational Studies"
  authors: ["Luke Keele", "Eli Ben-Michael", "Matthew Lenard", "Lindsay Page"]
  type: article
  venue: "Journal of Research on Educational Effectiveness"
  year: 2026
  topics: [balancing-weights, education]
  links:
    journal: "https://www.tandfonline.com/doi/full/10.1080/19345747.2025.2483775"
  doi: "10.1080/19345747.2025.2483775"

- id: gemmill-2026-methodological
  title: "Methodological Considerations for Investigating the Impact of Abortion Restrictions on Outcomes using Aggregate Panel Data"
  authors: ["Alison Gemmill", "Alexander Franks", "Avi Feller", "Elizabeth A Stuart", "Eli Ben-Michael", "Suzanne O Bell"]
  type: article
  venue: "American Journal of Epidemiology"
  year: 2026
  forthcoming: true
  topics: [synthetic-control, health-policy]
  links:
    journal: "https://academic.oup.com/aje/advance-article-abstract/doi/10.1093/aje/kwag032/8504393"
  doi: "10.1093/aje/kwag032"
  abstract: >-
    Dramatic changes in the US abortion policy landscape have led to growing interest in studying the health and social impacts of abortion bans. Many studies of population-level impacts necessarily rely on panel designs using aggregate state-level data to strengthen causal inference, yet such analyses risk pitfalls if they apply generic evaluation frameworks that overlook the complexity of the US abortion context and relevant outcomes. This commentary provides practical guidance for researchers engaged in panel studies of abortion policy, as well as for peer reviewers who may be less familiar with the methodological and substantive considerations in this area. Drawing from recent work, we highlight abortion-specific challenges that require attention, including time-varying confounding and violation of parallel trends, COVID-era disruptions, data suppression, spillover effects, and subgroup heterogeneity. We further recommend assessing sensitivity to including Texas, given its earlier implementation of abortion restrictions and potential outsized influence on results. Ultimately, we emphasize that rigorous evaluation of abortion policies requires thoughtful study design, context-specific considerations, and collaboration between methodologists and subject-matter experts.

- id: huang-2026-sensitivity
  title: "Sensitivity Analysis for Clustered Observational Studies with an Application to the Effectiveness of Magnet Nursing Hospitals"
  authors: ["Melody Huang", "Eli Ben-Michael", "Matthew McHugh", "Luke Keele"]
  type: article
  venue: "Journal of the Royal Statistical Society, Series A"
  year: 2026
  forthcoming: true
  topics: [sensitivity-partial-id, health-policy]
  links:
    journal: "https://academic.oup.com/jrsssa/advance-article/doi/10.1093/jrsssa/qnag002/8475349?searchresult=1&login=true"
    arxiv: "2504.21617"
  doi: "10.1093/jrsssa/qnag002"
  abstract: >-
    In a clustered observational study, treatment is assigned to groups and all units within the group are exposed to the treatment. Here, we use a clustered observational study (COS) design to estimate the effectiveness of Magnet Nursing certificates for emergency surgery patients. Recent research has introduced specialized weighting estimators for the COS design that balance baseline covariates at the unit and cluster level. These methods allow researchers to adjust for observed confounders, but are sensitive to unobserved confounding. In this paper, we develop new sensitivity analysis methods tailored to weighting estimators for COS designs. We provide several key contributions. First, we introduce a key bias decomposition, tailored to the specific confounding structure that arises in a COS. Second, we develop a sensitivity framework for weighted COS designs that constrain the error in the underlying weights. We introduce both a marginal sensitivity model and a variance-based sensitivity model, and extend both to accommodate multiple estimands. Finally, we propose amplification and benchmarking methods to better interpret the results. Throughout, we illustrate our proposed methods by analyzing the effectiveness of Magnet nursing hospitals.

- id: jia-2026-bayesian
  title: "Bayesian Safe Policy Learning with Chance Constrained Optimization: Application to Military Security Assessment during the Vietnam War"
  authors: ["Zeyang Jia", "Eli Ben-Michael", "Kosuke Imai"]
  type: article
  venue: "Journal of the Royal Statistical Society, Series A"
  year: 2026
  topics: [policy-learning, sensitivity-partial-id]
  links:
    journal: "https://academic.oup.com/jrsssa/advance-article/doi/10.1093/jrsssa/qnaf122/8223172?searchresult=1"
    arxiv: "2307.08840"
  doi: "10.1093/jrsssa/qnaf122"
  abstract: >-
    Algorithmic decisions and recommendations are used in many high-stakes decision-making settings such as criminal justice, medicine, and public policy. We investigate whether it would have been possible to improve a security assessment algorithm employed during the Vietnam War, using outcomes measured immediately after its introduction in late 1969. This empirical application raises several methodological challenges that frequently arise in high-stakes algorithmic decision-making. First, before implementing a new algorithm, it is essential to characterize and control the risk of yielding worse outcomes than the existing algorithm. Second, the existing algorithm is deterministic, and learning a new algorithm requires transparent extrapolation. Third, the existing algorithm involves discrete decision tables that are difficult to optimize over. To address these challenges, we introduce the Average Conditional Risk (ACRisk), which first quantifies the risk that a new algorithmic policy leads to worse outcomes for subgroups of individual units and then averages this over the distribution of subgroups. We also propose a Bayesian policy learning framework that maximizes the posterior expected value while controlling the posterior expected ACRisk. This framework separates the estimation of heterogeneous treatment effects from policy optimization, enabling flexible estimation of effects and optimization over complex policy classes. We characterize the resulting chance-constrained optimization problem as a constrained linear programming problem. Our analysis shows that compared to the actual algorithm used during the Vietnam War, the learned algorithm assesses most regions as more secure and emphasizes economic and political factors over military factors.

- id: benmichael-2025-does
  title: "Does AI Help Humans Make Better Decisions? A Methodological Framework for Experimental Evaluation"
  authors: ["Eli Ben-Michael", "D. James Greiner", "Melody Huang", "Kosuke Imai", "Zhichao Jiang", "Sooahn Shin"]
  type: article
  venue: "Proceedings of the National Academy of Sciences"
  year: 2025
  topics: [ai-llms, experiments, criminal-justice]
  links:
    journal: "https://www.pnas.org/doi/10.1073/pnas.2505106122"
    arxiv: "2403.12108"
  doi: "10.1073/pnas.2505106122"
  abstract: >-
    The use of Artificial Intelligence (AI), or more generally data-driven algorithms, has become ubiquitous in today's society. Yet, in many cases and especially when stakes are high, humans still make final decisions. The critical question, therefore, is whether AI helps humans make better decisions compared to a human-alone or AI-alone system. We introduce a new methodological framework to empirically answer this question with a minimal set of assumptions. We measure a decision maker's ability to make correct decisions using standard classification metrics based on the baseline potential outcome. We consider a single-blinded and unconfounded treatment assignment, where the provision of AI-generated recommendations is assumed to be randomized across cases with humans making final decisions. Under this study design, we show how to compare the performance of three alternative decision-making systems--human-alone, human-with-AI, and AI-alone. Importantly, the AI-alone system includes any individualized treatment assignment, including those that are not used in the original study. We also show when AI recommendations should be provided to a human-decision maker, and when one should follow such recommendations. We apply the proposed methodology to our own randomized controlled trial evaluating a pretrial risk assessment instrument. We find that the risk assessment recommendations do not improve the classification accuracy of a judge's decision to impose cash bail. Furthermore, we find that replacing a human judge with algorithms--the risk assessment score and a large language model in particular--leads to a worse classification performance.

- id: lin-2025-isolated
  title: "Isolated Causal Effects of Natural Language"
  authors: ["Victoria Lin", "Louis-Philippe Morency", "Eli Ben-Michael"]
  type: article
  venue: "International Conference on Machine Learning"
  year: 2025
  topics: [ai-llms]
  links:
    arxiv: "2410.14812"
  abstract: >-
    As language technologies become widespread, it is important to understand how changes in language affect reader perceptions and behaviors. These relationships may be formalized as the isolated causal effect of some focal language-encoded intervention (e.g., factual inaccuracies) on an external outcome (e.g., readers' beliefs). In this paper, we introduce a formal estimation framework for isolated causal effects of language. We show that a core challenge of estimating isolated effects is the need to approximate all non-focal language outside of the intervention. Drawing on the principle of omitted variable bias, we provide measures for evaluating the quality of both non-focal language approximations and isolated effect estimates themselves. We find that poor approximation of non-focal language can lead to bias in the corresponding isolated effect estimates due to omission of relevant variables, and we show how to assess the sensitivity of effect estimates to such bias along the two key axes of fidelity and overlap. In experiments on semi-synthetic and real-world data, we validate the ability of our framework to correctly recover isolated effects and demonstrate the utility of our proposed measures.

- id: benmichael-2025-safe
  title: "Safe Policy Learning through Extrapolation: Application to Pre-trial Risk Assessment"
  authors: ["Eli Ben-Michael", "D. James Greiner", "Kosuke Imai", "Zhichao Jiang"]
  type: article
  venue: "Journal of the American Statistical Association"
  year: 2025
  topics: [policy-learning, criminal-justice, sensitivity-partial-id]
  links:
    journal: "https://www.tandfonline.com/doi/full/10.1080/01621459.2025.2489135"
    arxiv: "2109.11679"
  doi: "10.1080/01621459.2025.2489135"
  abstract: >-
    Algorithmic recommendations and decisions have become ubiquitous in today's society. Many of these data-driven policies, especially in the realm of public policy, are based on known, deterministic rules to ensure their transparency and interpretability. We examine a particular case of algorithmic pre-trial risk assessments in the US criminal justice system, which provide deterministic classification scores and recommendations to help judges make release decisions. Our goal is to analyze data from a unique field experiment on an algorithmic pre-trial risk assessment to investigate whether the scores and recommendations can be improved. Unfortunately, prior methods for policy learning are not applicable because they require existing policies to be stochastic. We develop a maximin robust optimization approach that partially identifies the expected utility of a policy, and then finds a policy that maximizes the worst-case expected utility. The resulting policy has a statistical safety property, limiting the probability of producing a worse policy than the existing one, under structural assumptions about the outcomes. Our analysis of data from the field experiment shows that we can safely improve certain components of the risk assessment instrument by classifying arrestees as lower risk under a wide range of utility specifications, though the analysis is not informative about several components of the instrument.

- id: sun-2025-multiple
  title: "Using Multiple Outcomes to Improve the Synthetic Control Method"
  authors: ["Liyang Sun", "Eli Ben-Michael", "Avi Feller"]
  type: article
  venue: "Review of Economics and Statistics"
  year: 2025
  topics: [synthetic-control]
  links:
    journal: "https://direct.mit.edu/rest/article/doi/10.1162/rest_a_01592/128898/Using-Multiple-Outcomes-to-Improve-the-Synthetic"
    arxiv: "2311.16260"
  doi: "10.1162/rest_a_01592"
  abstract: >-
    When there are multiple outcome series of interest, Synthetic Control analyses typically proceed by estimating separate weights for each outcome. In this paper, we instead propose estimating a common set of weights across outcomes, by balancing either a vector of all outcomes or an index or average of them. Under a low-rank factor model, we show that these approaches lead to lower bias bounds than separate weights, and that averaging leads to further gains when the number of outcomes grows. We illustrate this via a re-analysis of the impact of the Flint water crisis on educational outcomes.

- id: bell-2025-us
  title: "US Abortion Bans and Fertility"
  authors: ["Suzanne O. Bell", "Alexander M. Franks", "David Arbour", "Selena Anjur-Dietrich", "Elizabeth A. Stuart", "Eli Ben-Michael", "Avi Feller", "Alison Gemmill"]
  type: article
  venue: "Journal of the American Medical Association"
  year: 2025
  topics: [synthetic-control, health-policy]
  links:
    journal: "https://jamanetwork.com/journals/jama/fullarticle/2830297"
  extra_links:
    - {label: "NYT Coverage", url: "https://www.nytimes.com/2025/02/13/health/abortion-bans-infant-mortality.html"}
    - {label: "CNN Coverage", url: "https://www.cnn.com/2025/02/13/health/abortion-bans-lead-to-births-infant-deaths/index.html"}
    - {label: "USA Today Coverage", url: "https://www.usatoday.com/story/life/health-wellness/2025/02/13/infants-die-abortion-bans-jama-study/78496779007/"}
  doi: "10.1001/jama.2024.28527"
  abstract: >-
    Importance Abortion bans may lead to births among those who are unable to overcome barriers to abortion. The population-level effects of these policies, particularly their unequal impacts across subpopulations in the US, remain unclear. Objective To assess heterogeneity in the association of abortion bans with changes in fertility in the US, within and across states. Design, Setting, and Participants Drawing from birth certificate and US Census Bureau data from 2012 through 2023 for all 50 states and the District of Columbia, this study used a bayesian panel data model to evaluate state-by-subgroup-specific changes in fertility associated with complete or 6-week abortion bans in 14 US states. The average percent and absolute change in the fertility rate among females aged 15 through 44 years was estimated overall and by state, and within and across states by age, race and ethnicity, marital status, education, and insurance payer. Exposure Complete or 6-week abortion ban. Main outcome and Measures Fertility rate (births per 1000 reproductive-aged females) overall and by subgroups. Results There were an estimated 1.01 (95% credible interval [CrI], 0.45-1.64) additional births above expectation per 1000 females aged 15 through 44 years (reproductive age) in states following adoption of abortion bans (60.55 observed vs 59.54 expected; 1.70% increase; 95% CrI, 0.75%-2.78%), equivalent to 22 180 excess births, with evidence of variation by state and subgroup. Estimated differences above expectation were largest for racially minoritized individuals (≈2.0%), unmarried individuals (1.79%), individuals younger than 35 years (≈2.0%), Medicaid beneficiaries (2.41%), and those without college degrees (high school diploma, 2.36%; some college, 1.58%), particularly in southern states. Differences in race and ethnicity and education across states explain most of the variability in the state-level association between abortion bans and fertility rates. Conclusion and Relevance These findings provide evidence that fertility rates in states with abortion bans were higher than would have been expected in the absence of these policies, with the largest estimated differences among subpopulations experiencing the greatest structural disadvantages and in states with among the worst maternal and child health and well-being outcomes.

- id: gemmill-2025-us
  title: "US Abortion Bans and Infant Mortality"
  authors: ["Alison Gemmill", "Alexander M. Franks", "Selena Anjur-Dietrich", "Amy Ozinsky", "David Arbour", "Elizabeth A. Stuart", "Eli Ben-Michael", "Avi Feller", "Suzanne O. Bell"]
